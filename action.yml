name: 'Amazon Batch "Register Job Definition" Action for GitHub Actions'
description: "Registers a job definition in file with AWS Batch"
branding:
  icon: "cloud"
  color: "green"
inputs:
  job-definition:
    description: "The path to the Batch job definition JSON file"
    required: true
  deregister-old-definition:
    description: "If true, all old job definition revisions will be deregistered (except the latest and those with excluded tags)"
    required: false
    default: "false"
  deregister-old-definition-exclude-tags:
    description: "Comma-separated list of tag key:value pairs (e.g., 'env:prod, keep:true'). Job definitions with any matching tag will NOT be deregistered"
    required: false
    default: ""
outputs:
  job-definition-name:
    description: "The name of the job definition"
  job-definition-arn:
    description: "The ARN of the job definition"
  revision:
    description: "The revision number of the job definition"
runs:
  using: "node24"
  main: "dist/index.js"
